          question: "男生 64 人、女生 80 人參加分組，每組男生一樣多，女生也一樣多且全部分完。若要使『每組的人數最少』，每組共有幾個人？",
          correctAnswers: ["9", "9人", "9個人"],
          userAnswer: "",
          analysis: {
            context: "雙重逆向思考：每組人數要最少，代表『分的組數要最多』！",
            logic: "組數最多 = (64, 80) 的最大公因數。求出組數後，分別算出每組男生與女生人數，再相加。",
            sop: "步驟 1：求 (64, 80) 的最大公因數：\n64 = 16 × 4；80 = 16 × 5\n最大公因數 = 16（代表最多可分成 16 組）。\n步驟 2：每組男生人數 = 64 ÷ 16 = 4 人。\n步驟 3：每組女生人數 = 80 ÷ 16 = 5 人。\n步驟 4：每組總人數 = 4 + 5 = 9 人。\n答案：9 人"
          }
        }
      ]
    };

    // -------------------------------------------------------------
    // 2. 狀態管理
    // -------------------------------------------------------------
    let currentCategory = 'tf';
    let currentIndex = 0;
    let stars = 0;
    let speechEnabled = true;

    // -------------------------------------------------------------
    // 3. 語音功能 (iPad Safari / Chrome 原生相容 Web Speech API)
    // -------------------------------------------------------------
    function playAudioTone(isCorrect) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (isCorrect) {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12); // E5
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.setValueAtTime(220, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        }
      } catch (e) {
        // 音效失敗時靜音，不打擾流程
      }
    }

    function speakText(text) {
      if (!speechEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel(); // 停止先前的朗讀

      // 去除數學符號與排版雜字，讓語音更流暢親切
      const cleanText = text
        .replace(/[×*]/g, '乘以')
        .replace(/[÷/]/g, '除以')
        .replace(/\[([^\]]+)\]/g, '$1的最小公倍數')
        .replace(/\(([^)]+)\)/g, '$1的最大公因數')
        .replace(/ステップ|SOP/gi, '步驟');

      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'zh-TW';
      utterance.rate = 0.95; // 適合小學生的適中語速
      utterance.pitch = 1.05;

      window.speechSynthesis.speak(utterance);
    }

    function speakCurrentQuestion() {
      const q = mathDatabase[currentCategory][currentIndex];
      speakText(q.question);
    }

    function speakExplanation() {
      const q = mathDatabase[currentCategory][currentIndex];
      const fullExp = `題目思考邏輯：${q.analysis.logic}。算式步驟：${q.analysis.sop}`;
      speakText(fullExp);
    }

    // 切換語音總開關
    document.getElementById('toggle-speech-btn').addEventListener('click', () => {
      speechEnabled = !speechEnabled;
      const icon = document.getElementById('speech-icon');
      const text = document.getElementById('speech-status-txt');
      if (speechEnabled) {
        icon.className = 'fa-solid fa-volume-high text-amber-600';
        text.innerText = '語音已開啟';
      } else {
        window.speechSynthesis.cancel();
        icon.className = 'fa-solid fa-volume-xmark text-slate-400';
        text.innerText = '語音已靜音';
      }
    });

    // -------------------------------------------------------------
    // 4. 畫面渲染與切換題型
    // -------------------------------------------------------------
    function switchCategory(cat) {
      currentCategory = cat;
      currentIndex = 0;

      // 更新按鈕樣式
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'text-amber-900', 'shadow-sm');
        btn.classList.add('text-amber-800');
      });
      const activeBtn = document.getElementById(`cat-${cat}`);
      activeBtn.classList.add('bg-white', 'text-amber-900', 'shadow-sm');
      activeBtn.classList.remove('text-amber-800');

      renderLevelBar();
      loadQuestion();
    }

    function renderLevelBar() {
      const bar = document.getElementById('level-selector-bar');
      bar.innerHTML = '';
      const list = mathDatabase[currentCategory];

      list.forEach((item, idx) => {
        const btn = document.createElement('button');
        btn.className = `flex-shrink-0 w-11 h-11 rounded-xl font-bold flex items-center justify-center transition border ${
          idx === currentIndex 
            ? 'bg-amber-500 text-white border-amber-600 shadow-md ring-2 ring-amber-300' 
            : item.userAnswer !== null 
              ? 'bg-emerald-100 text-emerald-800 border-emerald-300' 
              : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-amber-50'
        }`;
        btn.innerHTML = `${idx + 1}`;
        btn.onclick = () => {
          currentIndex = idx;
          renderLevelBar();
          loadQuestion();
        };
        bar.appendChild(btn);
      });
    }

    function loadQuestion() {
      window.speechSynthesis.cancel();
      const q = mathDatabase[currentCategory][currentIndex];
      const total = mathDatabase[currentCategory].length;

      // 類型標籤
      const typeBadge = document.getElementById('question-type-badge');
      if (currentCategory === 'tf') typeBadge.innerText = '觀念是非題';
      else if (currentCategory === 'choice') typeBadge.innerText = '四選一測驗';
      else if (currentCategory === 'fill') typeBadge.innerText = '精準填空題';
      else typeBadge.innerText = '生活應用題';

      document.getElementById('question-number-badge').innerText = `第 ${currentIndex + 1} / ${total} 題`;
      document.getElementById('question-text').innerText = q.question;

      // 隱藏解題區塊
      document.getElementById('explanation-container').classList.add('hidden');

      // 構建答題互動區
      const interactArea = document.getElementById('answer-interactive-area');
      interactArea.innerHTML = '';

      if (currentCategory === 'tf') {
        renderTFInteraction(interactArea, q);
      } else if (currentCategory === 'choice') {
        renderChoiceInteraction(interactArea, q);
      } else {
        renderInputInteraction(interactArea, q);
      }

      // 自動朗讀題意 (開箱極佳體驗)
      if (speechEnabled) {
        setTimeout(() => speakCurrentQuestion(), 300);
      }
    }

    // 4.1 是非題按鈕 (大圓按鈕，iPad 極佳點擊感)
    function renderTFInteraction(container, q) {
      const wrap = document.createElement('div');
      wrap.className = 'grid grid-cols-2 gap-4 max-w-md mx-auto';

      const trueBtn = document.createElement('button');
      trueBtn.className = `py-5 px-6 rounded-2xl border-2 flex flex-col items-center justify-center gap-1 font-black text-2xl transition active:scale-95 ${
        q.userAnswer === true 
          ? 'bg-blue-500 text-white border-blue-600 shadow-md' 
          : 'bg-blue-50 hover:bg-blue-100 text-blue-700 border-blue-200'
      }`;
      trueBtn.innerHTML = `<i class="fa-regular fa-circle text-3xl"></i><span class="text-lg">正確 (O)</span>`;
      trueBtn.onclick = () => submitAnswer(true);

      const falseBtn = document.createElement('button');
      falseBtn.className = `py-5 px-6 rounded-2xl border-2 flex flex-col items-center justify-center gap-1 font-black text-2xl transition active:scale-95 ${
        q.userAnswer === false 
          ? 'bg-rose-500 text-white border-rose-600 shadow-md' 
          : 'bg-rose-50 hover:bg-rose-100 text-rose-700 border-rose-200'
      }`;
      falseBtn.innerHTML = `<i class="fa-solid fa-xmark text-3xl"></i><span class="text-lg">錯誤 (X)</span>`;
      falseBtn.onclick = () => submitAnswer(false);

      wrap.appendChild(trueBtn);
      wrap.appendChild(falseBtn);
      container.appendChild(wrap);
    }

    // 4.2 選擇題按鈕 (直列清爽卡片)
    function renderChoiceInteraction(container, q) {
      const wrap = document.createElement('div');
      wrap.className = 'grid grid-cols-1 md:grid-cols-2 gap-3';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        const isSelected = q.userAnswer === idx;
        btn.className = `p-4 rounded-2xl border-2 text-left font-bold transition flex items-center gap-3 active:scale-98 ${
          isSelected 
            ? 'bg-amber-500 text-white border-amber-600 shadow-md' 
            : 'bg-slate-50 hover:bg-amber-50/70 border-slate-200 text-slate-800'
        }`;
        btn.innerHTML = `
          <span class="w-8 h-8 rounded-xl flex items-center justify-center ${isSelected ? 'bg-amber-600 text-white' : 'bg-white text-amber-700 border border-amber-200'} font-black text-sm">
            ${idx + 1}
          </span>
          <span class="text-base flex-1">${opt}</span>
        `;
        btn.onclick = () => submitAnswer(idx);
        wrap.appendChild(btn);
      });
      container.appendChild(wrap);
    }

    // 4.3 填空與應用題輸入區
    function renderInputInteraction(container, q) {
      const wrap = document.createElement('div');
      wrap.className = 'max-w-md mx-auto flex flex-col gap-3';

      const inputGroup = document.createElement('div');
      inputGroup.className = 'flex gap-2';

      const input = document.createElement('input');
      input.type = 'text';
      input.id = 'answer-input-box';
      input.value = q.userAnswer || '';
      input.placeholder = q.hint || '請輸入計算結果...';
      input.className = 'flex-1 p-3.5 rounded-2xl border-2 border-slate-300 focus:border-amber-500 focus:outline-none font-bold text-lg text-slate-800 bg-slate-50 focus:bg-white transition text-center';
      
      input.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') submitInputAnswer();
      });

      const submitBtn = document.createElement('button');
      submitBtn.className = 'px-6 py-3.5 bg-amber-500 hover:bg-amber-600 text-white font-black text-base rounded-2xl shadow-md transition active:scale-95';
      submitBtn.innerText = '提交';
      submitBtn.onclick = submitInputAnswer;

      inputGroup.appendChild(input);
      inputGroup.appendChild(submitBtn);
      wrap.appendChild(inputGroup);

      if (q.hint) {
        const hintTxt = document.createElement('p');
        hintTxt.className = 'text-xs text-amber-700 text-center font-bold flex items-center justify-center gap-1';
        hintTxt.innerHTML = `<i class="fa-regular fa-lightbulb"></i> 提示：${q.hint}`;
        wrap.appendChild(hintTxt);
      }

      container.appendChild(wrap);
    }

    function submitInputAnswer() {
      const input = document.getElementById('answer-input-box');
      if (!input || !input.value.trim()) return;
      submitAnswer(input.value.trim());
    }

    // -------------------------------------------------------------
    // 5. 判分與呈現 SOP 解析
    // -------------------------------------------------------------
    function submitAnswer(userVal) {
      const q = mathDatabase[currentCategory][currentIndex];
      q.userAnswer = userVal;

      let isCorrect = false;

      if (currentCategory === 'tf') {
        isCorrect = (userVal === q.answer);
      } else if (currentCategory === 'choice') {
        isCorrect = (userVal === q.answerIndex);
      } else {
        // 填空或應用題（去除空白、中英文逗號統一處理）
        const normalized = String(userVal).replace(/\s+/g, '').replace(/,/g, '、');
        isCorrect = q.correctAnswers.some(ans => {
          const normAns = String(ans).replace(/\s+/g, '').replace(/,/g, '、');
          return normAns === normalized;
        });
      }

      // 音效與加分
      playAudioTone(isCorrect);
      if (isCorrect) {
        stars += 10;
        document.getElementById('star-count').innerText = stars;
      }

      // 展開詳解區
      showExplanation(isCorrect, q);
      renderLevelBar();
    }

    function showExplanation(isCorrect, q) {
      const expContainer = document.getElementById('explanation-container');
      const feedbackBanner = document.getElementById('feedback-banner');
      const feedbackIcon = document.getElementById('feedback-icon');
      const feedbackText = document.getElementById('feedback-text');

      expContainer.classList.remove('hidden');

      if (isCorrect) {
        feedbackBanner.className = 'flex items-center gap-3 p-4 rounded-2xl mb-4 font-bold text-base bg-emerald-100 text-emerald-800 border border-emerald-300';
        feedbackIcon.className = 'fa-solid fa-circle-check text-2xl text-emerald-600';
        feedbackText.innerText = '太棒了！答對了！你的因數倍數概念非常清晰！(+10 知識星)';
      } else {
        feedbackBanner.className = 'flex items-center gap-3 p-4 rounded-2xl mb-4 font-bold text-base bg-rose-100 text-rose-800 border border-rose-300';
        feedbackIcon.className = 'fa-solid fa-circle-xmark text-2xl text-rose-600';
        feedbackText.innerText = '別灰心！這題是易錯考點，仔細閱讀下方的解題思考SOP吧！';
      }

      // 填入三部曲解析
      document.getElementById('exp-context').innerText = q.analysis.context;
      document.getElementById('exp-logic').innerText = q.analysis.logic;
      document.getElementById('exp-sop').innerText = q.analysis.sop;

      // 語音自動輔助解說
      if (speechEnabled) {
        speakExplanation();
      }

      // 平滑滾動至詳解
      setTimeout(() => {
        expContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    }

    function nextQuestion() {
      const list = mathDatabase[currentCategory];
      if (currentIndex < list.length - 1) {
        currentIndex++;
      } else {
        // 本分類做完，自動前往下一分類
        if (currentCategory === 'tf') switchCategory('choice');
        else if (currentCategory === 'choice') switchCategory('fill');
        else if (currentCategory === 'fill') switchCategory('app');
        else {
          currentIndex = 0;
        }
      }
      renderLevelBar();
      loadQuestion();
    }

    // -------------------------------------------------------------
    // 6. iPad 觸控草稿板功能 (Canvas)
    // -------------------------------------------------------------
    const canvasModal = document.getElementById('scratchpad-modal');
    const canvas = document.getElementById('scratch-canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let strokeWidth = 3;

    function resizeCanvas() {
      const container = document.getElementById('canvas-container');
      if (!container) return;
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = strokeWidth;
    }

    function toggleScratchpad() {
      const isHidden = canvasModal.classList.contains('hidden');
      if (isHidden) {
        canvasModal.classList.remove('hidden');
        setTimeout(() => resizeCanvas(), 50);
      } else {
        canvasModal.classList.add('hidden');
      }
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function setStroke(w) {
      strokeWidth = w;
      ctx.lineWidth = w;
    }

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const pos = getCanvasPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const pos = getCanvasPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    });

    window.addEventListener('mouseup', () => { isDrawing = false; });

    // iPad Touch 事件原生相容
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      isDrawing = true;
      const pos = getCanvasPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getCanvasPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      isDrawing = false;
    });

    window.addEventListener('resize', () => {
      if (!canvasModal.classList.contains('hidden')) {
        resizeCanvas();
      }
    });

    // -------------------------------------------------------------
    // 7. 初始啟動
    // -------------------------------------------------------------
    window.onload = function() {
      renderLevelBar();
      loadQuestion();
    };
  </script>
</body>
